<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warzone 2D - Battle Royale</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            user-select: none;
        }
        
        #gameCanvas {
            border: 2px solid #333;
            background: #2d5a27;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
        
        .game-container {
            position: relative;
        }
        
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        .minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            border: 2px solid #fff;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
        }
        
        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 1000;
        }
        
        .crosshair {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }
        
        .crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 2px;
            background: white;
            transform: translate(-50%, -50%);
        }
        
        .crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 8px;
            background: white;
            transform: translate(-50%, -50%);
        }
        
        /* Mobile styles */
        @media (max-width: 768px) {
            #gameCanvas {
                width: 100vw;
                height: 60vh;
            }
            
            .hud {
                font-size: 12px;
                top: 5px;
                left: 5px;
            }
            
            .minimap {
                width: 100px;
                height: 100px;
                top: 5px;
                right: 5px;
            }
            
            .controls {
                bottom: 5px;
                left: 5px;
                font-size: 10px;
                max-width: 80%;
            }
        }
        
        /* Prevent selection and zoom */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>
        <div class="crosshair" id="crosshair"></div>
        
        <div class="hud" id="hud">
            <div>Vida: <span id="health">100</span></div>
            <div>Armadura: <span id="armor">0</span></div>
            <div>Munição: <span id="ammo">30/90</span></div>
            <div>Arma: <span id="weapon">Rifle de Assalto</span></div>
            <div>Kills: <span id="kills">0</span></div>
        </div>
        
        <canvas class="minimap" id="minimap" width="150" height="150"></canvas>
        
        <div class="controls">
            <div>WASD - Mover | Mouse/Touch - Mirar | Click/Tap - Atirar</div>
            <div>E - Coletar loot | R - Recarregar | 1,2,3 - Trocar arma</div>
            <div>ESC - Pausar | Mobile: Tap para mover e atirar</div>
        </div>
        
        <div class="loading" id="loading">Carregando Warzone 2D...</div>
    </div>

    <!-- Scripts do jogo -->
    <script src="js/utils.js"></script>
    <script src="js/gameObjects.js"></script>
    <script src="js/player.js"></script>
    <script src="js/weapons.js"></script>
    <script src="js/loot.js"></script>
    <script src="js/map.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
