<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assista seus canais favoritos ao vivo!</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="description" content="Assista TNT Sports, Megapix, Space e outros canais ao vivo. Site feito por Brunex.">
    <meta name="keywords" content="TNT Sports, Megapix, Space, Telecine, HBO, Canais ao vivo, Brunex">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2322986201594913"
        crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div id="ambient-background"></div>
    <div class="player-section">
        <div class="video-container" id="video-container" style="display: none;">
            <div class="video-background"></div>
            <div class="loading-overlay">
                <div class="loading-spinner"></div>
            </div>
            <iframe 
                id="iframe-video" 
                allow="encrypted-media; autoplay; fullscreen; picture-in-picture" 
                allowfullscreen="true"
                webkitallowfullscreen="true" 
                mozallowfullscreen="true"
                frameborder="0" 
                width="100%" 
                height="600"
                style="pointer-events: auto;"
            ></iframe>
        </div>
        <div class="program-info"></div>
    </div>
    <div class="text-container">
        <h3 class="message" data-text="Assista seus canais favoritos ao vivo!">Assista seus canais favoritos ao vivo!</h3>
        <p class="author-container">
            <span class="smoke-text" id="smoke-text"></span>
        </p>
    </div>
    <div class="container">
        <button class="channel-button ripple" data-channel="tntsports">TNT Sports</button>
        <button class="channel-button ripple" data-channel="megapix">Megapix</button>
        <button class="channel-button ripple" data-channel="space">Space</button>
        <button class="channel-button ripple" data-channel="telecineaction">Telecine Action</button>
        <button class="channel-button ripple" data-channel="telecinetouch">Telecine Touch</button>
        <button class="channel-button ripple" data-channel="telecinepremium">Telecine Premium</button>
        <button class="channel-button ripple" data-channel="hbo">HBO</button>
        <button class="channel-button ripple" data-channel="hboplus">HBO Plus</button>
        <button class="channel-button ripple" data-channel="fx">FX</button>
        <button class="channel-button ripple" data-channel="globomg">Globo Minas</button>
    </div>
    <div class="ambient-mode-container">
        <span class="light-icon">💡</span>
        <span>Modo Ambiente</span>
        <label class="switch">
            <input type="checkbox" id="ambient-mode-toggle">
            <span class="slider round"></span>
        </label>
    </div>
    <div class="contador-container">
        <span>Pessoas Online: </span>
        <div align="center">
            <a title='Contador de Visitas do MegaContador' href='https://megacontador.com.br/'>
                <img src='https://megacontador.com.br/img-xAgj5K3nGHJb0DfB-48.gif' border='0' alt='Contador de visitas'>
            </a>
        </div>
    </div>
    <!-- Elementos de UI Extras -->
    <div class="scroll-indicator"></div>
    <div class="custom-cursor"></div>
    <div class="back-to-top" id="backToTop"></div>
    
    <!-- Loader de Página -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div class="loader-text">Carregando Canais...</div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script>
        // Script para efeitos visuais básicos
        document.addEventListener('DOMContentLoaded', function() {
            // Adicionar classe fade-in-page ao body
            document.body.classList.add('fade-in-page');
            
            // Esconder loader após carregamento
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.classList.add('hidden');
                }
            }, 1500);
            
            // Cursor personalizado
            const cursor = document.querySelector('.custom-cursor');
            if (cursor) {
                document.addEventListener('mousemove', (e) => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                });
            }
            
            // Indicador de scroll
            const scrollIndicator = document.querySelector('.scroll-indicator');
            if (scrollIndicator) {
                window.addEventListener('scroll', () => {
                    const scrolled = (window.pageYOffset / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
                    scrollIndicator.style.width = scrolled + '%';
                });
            }
            
            // Botão voltar ao topo
            const backToTop = document.getElementById('backToTop');
            if (backToTop) {
                window.addEventListener('scroll', () => {
                    if (window.pageYOffset > 300) {
                        backToTop.classList.add('visible');
                    } else {
                        backToTop.classList.remove('visible');
                    }
                });
                
                backToTop.addEventListener('click', () => {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });
            }
        });
    </script>
</body>
</html>
